name: PLUZ5 Pack

# Builds the PLUZ5-Cust download pack from this repo when a release is published
# (or on demand), attaches the zip to the release, and optionally mirrors it into
# a template repo (needs the PACK_TOKEN secret).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Pack version (for the zip name)'
        default: 'v8.0'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACK_TOKEN: ${{ secrets.PACK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the pack
        run: python core/pluz_pack.py --version "$VERSION"
      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "$VERSION" dist/PLUZ5-Cust-*-FULL.zip --clobber
      - name: Keep as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLUZ5-Cust-pack
          path: dist/PLUZ5-Cust-*-FULL.zip
      - name: Mirror to the PLUZ5-Cust template repo
        if: ${{ env.PACK_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${PACK_TOKEN}@github.com/${{ github.repository_owner }}/PLUZ5-Cust.git" mirror
          find mirror -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/PLUZ5-Cust/. mirror/
          cd mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "pack $VERSION" && git push)
